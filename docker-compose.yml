services:
  postgres:
    image: postgres:17
    container_name: sso-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
      POSTGRES_DB: sso
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
