<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your email</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; padding:40px; max-width:480px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px; font-size:22px; color:#111827;">Verify your email address</h1>
              <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#374151;">
                Your verification code is:
              </p>
              <p style="margin:0 0 24px; font-size:32px; font-weight:bold; letter-spacing:8px; text-align:center; color:#111827;">
                ${code}
              </p>
              <p style="margin:0 0 24px; font-size:13px; line-height:1.5; color:#6b7280;">
                This code will expire in ${identity_ttl}.
              </p>
              <hr style="border:none; border-top:1px solid #e5e7eb; margin:0 0 16px;">
              <p style="margin:0; font-size:12px; color:#9ca3af;">
                If you did not request this, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
