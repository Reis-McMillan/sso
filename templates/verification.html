<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your email</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; padding:40px; max-width:480px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px; font-size:22px; color:#111827;">Verify your email address</h1>
              <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#374151;">
                Click the button below to verify your email address. This link will expire in ${identity_ttl}.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
                <tr>
                  <td align="center" style="background-color:#111827; border-radius:6px;">
                    <a href="${verification_url}" target="_blank" style="display:inline-block; padding:12px 32px; font-size:15px; font-weight:bold; color:#ffffff; text-decoration:none;">
                      Verify Email
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 8px; font-size:13px; line-height:1.5; color:#6b7280;">
                Or copy and paste this URL into your browser:
              </p>
              <p style="margin:0 0 24px; font-size:13px; line-height:1.5; word-break:break-all;">
                <a href="${verification_url}" style="color:#2563eb;">${verification_url}</a>
              </p>
              <hr style="border:none; border-top:1px solid #e5e7eb; margin:0 0 16px;">
              <p style="margin:0; font-size:12px; color:#9ca3af;">
                If you did not request this, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
